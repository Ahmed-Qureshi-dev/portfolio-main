<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Ahmed Qureshi</title>
    <meta name="description" content="Oops! The page you're looking for doesn't exist. Return to Ahmed Qureshi's portfolio.">
    <meta name="robots" content="noindex, follow">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
        }
        h1 {
            font-size: 120px;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .error-code {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #ff6b6b;
        }
        p {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        a {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: #000;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 10px;
        }
        a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.3);
        }
        .secondary-link {
            background: transparent;
            border: 2px solid #00d4ff;
            color: #00d4ff;
        }
        .secondary-link:hover {
            background: rgba(0, 212, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1>Oops!</h1>
        <p>The page you're looking for doesn't exist or has been moved. But don't worry, you can always find what you need on my portfolio.</p>
        <a href="https://ahmed-qureshi-three.vercel.app/">Go Back Home</a>
        <a href="https://ahmed-qureshi-three.vercel.app/projects" class="secondary-link">View Projects</a>
    </div>
</body>
</html>
