<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Ahmed Qureshi</title>
    <meta name="description" content="Oops! The page you're looking for doesn't exist. Return to Ahmed Qureshi's portfolio.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#1b2d31">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
                radial-gradient(circle at 10% 10%, rgba(66, 166, 155, 0.18), transparent 30rem),
                radial-gradient(circle at 92% 0%, rgba(217, 164, 65, 0.14), transparent 28rem),
                linear-gradient(135deg, #0f1718 0%, #162628 42%, #211a17 100%);
            color: #f7f1e3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
            border: 1px solid rgba(230, 214, 176, 0.16);
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)), #172426;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
        }
        h1 {
            font-size: 120px;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #d9a441, #42a69b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .error-code {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #d9a441;
        }
        p {
            font-size: 18px;
            color: #b5c6c0;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        a {
            display: inline-block;
            padding: 12px 30px;
            background: #d9a441;
            color: #0f1718;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 10px;
        }
        
        a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(217, 164, 65, 0.3);
        }
        .secondary-link {
            background: transparent;
            border: 2px solid #d9a441;
            color: #d9a441;
        }
        .secondary-link:hover {
            background: rgba(217, 164, 65, 0.1);
        }

        @media (max-width: 640px) {
            body {
                align-items: stretch;
                padding: 16px;
            }

            .container {
                width: 100%;
                max-width: none;
                min-height: calc(100svh - 32px);
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 28px 18px;
                border-radius: 18px;
            }

            h1 {
                font-size: clamp(70px, 24vw, 104px);
                line-height: 0.95;
                margin-bottom: 14px;
            }

            .error-code {
                font-size: clamp(32px, 12vw, 48px);
                margin-bottom: 12px;
            }

            p {
                font-size: 16px;
                line-height: 1.65;
                margin-bottom: 22px;
            }

            a {
                width: 100%;
                margin: 6px 0;
                padding: 13px 18px;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1>Oops!</h1>
        <p>The page you're looking for doesn't exist or has been moved. But don't worry, you can always find what you need on my portfolio.</p>
        <a href="https://ahmed-qureshi-three.vercel.app/">Go Back Home</a>
        <a href="https://ahmed-qureshi-three.vercel.app/projects" class="secondary-link">View Projects</a>
    </div>
</body>
</html>
